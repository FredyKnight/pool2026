<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool de hockey 2026-2027</title>
<meta name="apple-mobile-web-app-title" content="Pool 2026-27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Page des participants : lecture seule du classement publié par l'app Mac de Fred (Supabase « Pool hockey »). */
:root { color-scheme: dark; --bg:#0b1520; --bg2:#12202d; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.09); --ink:#eaf2f8; --muted:#8fa6ba;
  --led:#ffb000; --red:#c8102e; --blue:#2f6db5; --good:#5fd08f; --bad:#ff7a70; --sky:#7fb6f5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif; }
* { box-sizing:border-box }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body) }
body { background:radial-gradient(ellipse at 50% -10%, #1b3148 0%, var(--bg) 60%) fixed; padding-inline:16px; padding-block:0 40px }
.wrap { max-width:860px; margin:0 auto }
header { text-align:center; padding-block:28px 14px; border-bottom:6px solid var(--red); margin-bottom:18px }
.kick { font-size:14px; letter-spacing:.3em; color:var(--muted); font-weight:600 }
h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px,9vw,68px); text-wrap:balance; line-height:.95; margin:6px 0 4px; letter-spacing:.5px }
h1 span { color:var(--led) }
.maj { color:var(--muted); font-size:14px }
.apercu { background:rgba(255,176,0,.14); border:1px solid rgba(255,176,0,.5); color:var(--led); border-radius:10px; padding:10px 12px; font-weight:600; font-size:14px; margin:12px 0 }
h2 { font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.5px; margin:26px 0 10px; text-transform:uppercase }
.row { background:var(--card); border-radius:14px; margin-bottom:8px; overflow:hidden }
.row.moi { outline:2px solid var(--led) }
.row summary { list-style:none; display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 14px; cursor:pointer }
.row summary::-webkit-details-marker { display:none }
.rk { font-family:var(--display); font-weight:800; font-size:36px; color:var(--led); text-align:center; line-height:1 }
.nm { font-weight:700; font-size:18px; line-height:1.15; overflow-wrap:anywhere }
.nm .prix { font-size:12px; font-weight:700; background:rgba(255,176,0,.22); color:var(--led); border-radius:99px; padding:2px 7px; margin-left:6px; vertical-align:middle }
.sub { color:var(--muted); font-size:13px; margin-top:2px }
.tot { text-align:right; white-space:nowrap; font-family:var(--display); font-weight:800; font-size:32px; line-height:1; font-variant-numeric:tabular-nums }
.tot small { display:block; font-family:var(--body); font-weight:600; font-size:12px; color:var(--muted) }
.up { color:var(--good) } .dn { color:var(--bad) }
.places { padding:4px 14px 14px; border-top:1px solid var(--line) }
.pl { display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px }
.pl:last-child { border-bottom:0 }
.pl.off { opacity:.45 }
.pl img { width:30px; height:22px; object-fit:contain }
.pl .d { color:var(--muted); font-size:12px }
.pl .p { font-weight:700; font-variant-numeric:tabular-nums }
.grp { font-size:12px; letter-spacing:.12em; color:var(--muted); font-weight:700; margin:10px 0 2px }
.faits { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:10px }
.fait { background:var(--card); border-radius:14px; padding:14px }
.fait .t { font-size:12px; letter-spacing:.14em; font-weight:800; color:var(--led) }
.fait .n { display:flex; gap:10px; align-items:center; font-weight:700; font-size:20px; margin:6px 0 2px }
.fait .n img { width:40px; height:30px; object-fit:contain }
.fait .s { color:var(--sky); font-weight:700; font-size:14px }
.fait .x { font-style:italic; color:#cfdbe6; font-size:15px; margin-top:6px; line-height:1.35 }
.chart { background:var(--card); border-radius:14px; padding:10px; overflow-x:auto }
.chart text { fill:var(--muted); font:11px var(--body) }
.trade { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:15px }
.regles { color:var(--muted); font-size:13px; line-height:1.5; margin-top:26px; text-align:center }
.err { color:var(--bad); text-align:center; padding:30px }
.imgs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.imgs a { display:block; background:var(--card); border-radius:12px; padding:6px; color:var(--ink); text-decoration:none; text-align:center; font-weight:600; font-size:14px }
.imgs img { width:100%; aspect-ratio:1080/1350; object-fit:cover; border-radius:8px; display:block; margin-bottom:6px; background:#0f1b27 }
.media { background:var(--card); border-radius:14px; padding:10px }
.media video { width:100%; max-width:380px; aspect-ratio:9/16; border-radius:10px; background:#000; display:block; margin:0 auto }
.cap { color:var(--muted); font-size:13px; margin-top:8px; text-align:center; text-wrap:pretty }
.buts { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:10px }
.but { display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:10px; align-items:center; background:var(--card); border-radius:14px; padding:10px 12px; color:var(--ink); text-decoration:none }
.but img.ph { width:52px; height:52px; border-radius:50%; object-fit:cover; background:#0f1b27 }
.but .n { font-weight:700; font-size:16px; overflow-wrap:anywhere }
.but .o { color:var(--led); font-weight:800; font-size:13px }
.but .m { color:var(--muted); font-size:12px; margin-top:2px }
.play { background:var(--red); color:#fff; border-radius:99px; padding:6px 11px; font-weight:800; font-size:13px; white-space:nowrap; text-decoration:none }
.matchs { display:grid; gap:6px; margin-top:10px }
.mt { display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--card); border-radius:10px; padding:8px 10px; font-size:14px }
.mt img { width:28px; height:20px; object-fit:contain }
.mt .sc { font-family:var(--display); font-weight:800; font-size:20px }
.mt .et { color:var(--muted); font-size:12px; margin-right:auto }
.tag { font-size:12px; font-weight:700; background:rgba(255,176,0,.22); color:var(--led); border-radius:99px; padding:2px 8px; margin-left:8px; vertical-align:middle; letter-spacing:0 }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick">POOL DE HOCKEY · 2026-2027</div>
    <h1>CLASSEMENT <span>DU POOL</span></h1>
    <div class="maj" id="maj">Chargement…</div>
  </header>
  <div id="apercu"></div>
  <section id="medias"></section>
  <main id="app"></main>
  <p class="regles" id="regles"></p>
</div>
<script>
// Les deux valeurs PUBLIQUES du projet Supabase « Pool hockey » (la clé « anon » ne permet que de LIRE le classement).
const SUPABASE_URL = "https://jijafhhinuhhosmrvesq.supabase.co";
const SUPABASE_ANON = "sb_publishable_HiNsnpdqwA25RpPEmMbwJw_UPkoV2cn";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logo = ab => ab && /^[A-Z]{3}$/.test(ab) ? `<img src="https://assets.nhle.com/logos/nhl/svg/${ab}_dark.svg" alt="${ab}">` : "";
const n = v => Math.round(v ?? 0);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const jour = s => { const [y,m,d] = s.split("-").map(Number); return `${d === 1 ? "1er" : d} ${MOIS[m-1]}`; };

// Deux documents : « classement » (l'app Mac, à chaque mise à jour) et « medias » (images du jour et récap vidéo,
// versions prénoms seulement, envoyées par supabase/publier_medias.py).
async function charger() {
  if (new URLSearchParams(location.search).has("demo")) return {doc: await (await fetch("demo.json", {cache: "no-store"})).json(), medias: null};
  if (SUPABASE_URL.startsWith("__")) throw new Error("bientôt");
  const r = await fetch(`${SUPABASE_URL}/rest/v1/publication?id=in.(classement,medias)&select=id,data`, {headers: {apikey: SUPABASE_ANON}, cache: "no-store"});
  if (!r.ok) throw new Error(`Supabase a répondu ${r.status}`);
  const rows = await r.json(), by = Object.fromEntries(rows.map(x => [x.id, x.data]));
  if (!by.classement) throw new Error("Rien de publié pour l'instant.");
  return {doc: by.classement, medias: by.medias || null};
}

// Seules des adresses de l'espace de stockage du projet sont affichées.
const sur = u => typeof u === "string" && u.startsWith(`${SUPABASE_URL}/storage/v1/object/public/media/`) ? u : "";

function medias(m) {
  if (!m) return "";
  let h = "";
  const im = m.images || {};
  const imgs = [["classement", "Le classement"], ["faits", "Les faits saillants"]].filter(([k]) => sur(im[k]));
  if (imgs.length) {
    h += `<h2>Les images du jour${im.apercu ? `<span class="tag">aperçu</span>` : ""}</h2><div class="imgs">` + imgs.map(([k, t]) =>
      `<a href="${esc(sur(im[k]))}" target="_blank" rel="noopener"><img src="${esc(sur(im[k]))}" alt="${t}">${t}</a>`).join("") +
      `</div><div class="cap">Touche une image pour l'ouvrir en grand, puis garde-la ou partage-la.</div>`;
  }
  const rc = m.recap;
  if (rc && sur(rc.video)) {
    h += `<h2>Le récap de la semaine ${n(rc.semaine)}${rc.apercu ? `<span class="tag">aperçu</span>` : ""}</h2>
      <div class="media"><video controls playsinline preload="none" poster="${esc(sur(rc.affiche))}" src="${esc(sur(rc.video))}"></video>
      <div class="cap">Du ${jour(rc.debut)} au ${jour(rc.fin)} · les bons coups, les mauvais coups et un peu de taquinerie. Nouveau chaque lundi matin.</div></div>`;
  }
  return h;
}

function afficher(d) {
  const maj = new Date(d.maj);
  document.getElementById("maj").textContent = `Mis à jour le ${maj.toLocaleDateString("fr-CA", {weekday: "long", day: "numeric", month: "long"})} à ${maj.toLocaleTimeString("fr-CA", {hour: "2-digit", minute: "2-digit"})} · statistiques officielles de la LNH`;
  document.getElementById("apercu").innerHTML = d.apercu ? `<div class="apercu">APERÇU : chiffres de la saison 2025-26 avec nos alignements, en attendant les premiers matchs.</div>` : "";
  document.getElementById("regles").textContent = `${d.regles} · bourse ${d.prix.join(" $ · ")} $`;
  const al = Object.fromEntries(d.alignements.map(t => [t.nom, t]));
  let h = `<h2>Classement</h2>`;
  for (const r of d.classement) {
    const t = al[r.nom];
    const mv = r.mouvement ? `<span class="${r.mouvement > 0 ? "up" : "dn"}">${r.mouvement > 0 ? "▲" : "▼"}${Math.abs(r.mouvement)}</span> · ` : "";
    const groupes = [["j", "JOUEURS — les 10 meilleurs comptent"], ["g", "GARDIENS — le meilleur compte"], ["e", "ÉQUIPES — la meilleure compte"]];
    const places = t ? groupes.map(([k, titre]) => `<div class="grp">${titre}</div>` + t.places.filter(p => p.type === k).map(p =>
      `<div class="pl ${p.compte ? "" : "off"}">${logo(p.eq)}<div>${esc(p.nom)}<div class="d">${esc(p.detail)}${p.compte ? "" : " · ne compte pas"}</div></div><div class="p">${n(p.points)}</div></div>`).join("")).join("") : "";
    h += `<details class="row ${r.moi ? "moi" : ""}"><summary>
      <div class="rk">${r.rang}</div>
      <div><div class="nm">${esc(r.nom)}${r.prix ? `<span class="prix">${r.prix} $</span>` : ""}</div>
        <div class="sub">${mv}Joueurs ${n(r.joueurs)} · Gardien ${n(r.gardien)} · Équipe ${n(r.equipe)}${r.jour ? ` · +${n(r.jour)} hier` : ""}</div></div>
      <div class="tot">${n(r.total)}<small>${r.rang === 1 ? "en tête" : n(r.ecart)}</small></div>
    </summary><div class="places">${places}</div></details>`;
  }
  h += videos(d);
  if (d.faits && d.faits.cartes.length) {
    h += `<h2>Les faits saillants · ${jour(d.faits.date)}</h2><div class="faits">` + d.faits.cartes.map(c =>
      `<div class="fait"><div class="t">${esc(c.titre).toUpperCase()}</div><div class="n">${logo(c.eq)}${esc(c.nom)}</div><div class="s">${esc(c.stat)}</div><div class="x">${esc(c.texte)}</div></div>`).join("") + `</div>`;
  }
  if (d.evolution && d.evolution.length >= 2) h += `<h2>Évolution</h2><div class="chart">${graphique(d)}</div>`;
  if (d.echanges && d.echanges.length) {
    h += `<h2>Échanges</h2>` + d.echanges.slice().reverse().map(e => `<div class="trade">${jour(e.date)} · <b>${esc(d.noms[e.participant] || e.participant)}</b> : ${esc(e.sortant)} → ${esc(e.entrant)}</div>`).join("");
  }
  document.getElementById("app").innerHTML = h;
}

// Les buts de nos joueurs en vidéo (lecteur officiel de la LNH) : seules les adresses de ce lecteur sont acceptées.
const vid = u => typeof u === "string" && u.startsWith("https://players.brightcove.net/6415718365001/") ? u : "";
const photo = u => typeof u === "string" && u.startsWith("https://assets.nhle.com/") ? u : "";
function videos(d) {
  if (!d.videos || !d.videos.length) return "";
  return d.videos.map(v => {
    let h = `<h2>Les buts de nos joueurs · ${esc(v.titre.toLowerCase())}</h2>`;
    h += v.buts.length ? `<div class="buts">` + v.buts.map(b => `<div class="but">
        ${photo(b.photo) ? `<img class="ph" src="${esc(photo(b.photo))}" alt="">` : logo(b.eq)}
        <div><div class="n">${esc(b.nom)} ${logo(b.eq)}</div>
          <div class="o">${b.owner ? `BUT · chez ${esc(b.owner)}` : "passe d'un joueur du pool"}</div>
          <div class="m">${esc(b.periode)} · ${esc(b.temps)} · ${esc(b.score)}${b.genre ? ` · ${esc(b.genre)}` : ""}<br>Passes : ${esc(b.passes)}</div></div>
        ${vid(b.video) ? `<a class="play" href="${esc(vid(b.video))}" target="_blank" rel="noopener">▶ Voir</a>` : `<span class="m">vidéo à venir</span>`}
      </div>`).join("") + `</div>`
      : `<p class="cap">Aucun but de nos joueurs${v.titre === "Ce soir" ? " pour l'instant" : ""}.</p>`;
    if (v.matchs.length) h += `<div class="matchs">` + v.matchs.map(m => `<div class="mt">${logo(m.away)}<span class="sc">${n(m.awayScore)} – ${n(m.homeScore)}</span>${logo(m.home)}
        <span class="et">${esc(m.etat)}</span>
        ${vid(m.resume) ? `<a class="play" href="${esc(vid(m.resume))}" target="_blank" rel="noopener">▶ Résumé 3 min</a>` : ""}
        ${vid(m.condense) ? `<a class="play" href="${esc(vid(m.condense))}" target="_blank" rel="noopener">▶ Condensé</a>` : ""}</div>`).join("") + `</div>`;
    return h;
  }).join("");
}

function graphique(d) {
  const W = 820, H = 260, L = 40, B = 24, jours = d.evolution, ids = Object.keys(d.noms);
  const max = Math.max(1, ...jours.flatMap(j => Object.values(j.totals)));
  const x = i => L + i * (W - L - 90) / Math.max(1, jours.length - 1), y = v => H - B - v / max * (H - B - 10);
  const couleurs = ["#ffb000", "#7fb6f5", "#5fd08f", "#ff7a70", "#c79bf0", "#f2b84b", "#6fd6d0", "#e6e6e6", "#f28cc0"];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px">`;
  [0, .5, 1].forEach(f => s += `<line x1="${L}" x2="${W - 90}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="rgba(255,255,255,.08)"/><text x="4" y="${y(max * f) + 4}">${n(max * f)}</text>`);
  ids.forEach((id, k) => {
    const pts = jours.map((j, i) => `${x(i)},${y(j.totals[id] ?? 0)}`).join(" ");
    const last = jours[jours.length - 1].totals[id] ?? 0;
    s += `<polyline points="${pts}" fill="none" stroke="${couleurs[k % couleurs.length]}" stroke-width="2.5"/><text x="${W - 86}" y="${y(last) + 4}" style="fill:${couleurs[k % couleurs.length]}">${esc(d.noms[id])}</text>`;
  });
  return s + `</svg>`;
}

let dernierMedias = null;
async function go() {
  try {
    const {doc, medias: m} = await charger();
    afficher(doc);
    // on ne redessine les médias que s'ils ont changé : l'actualisation aux 5 min ne coupe pas une vidéo en cours
    const cle = JSON.stringify(m);
    if (cle !== dernierMedias) { document.getElementById("medias").innerHTML = medias(m); dernierMedias = cle; }
  }
  catch (e) {
    document.getElementById("maj").textContent = "";
    document.getElementById("app").innerHTML = e.message === "bientôt"
      ? `<p class="err" style="color:var(--led)">Le classement du pool arrive ici très bientôt : il s'affichera dès les premiers matchs de la saison.</p>`
      : `<p class="err">Classement indisponible pour l'instant (${esc(e.message)}). Réessaie dans quelques minutes.</p>`;
  }
}
go(); setInterval(go, 5 * 60 * 1000);
</script>
</body>
</html>
